# Experiment 5's CloudLab placement (profile branchDB, project rasl-PG0; cluster of 22 Oct 2026, see
# .agent/cloudlab.md): Neon's storage layer at Wisconsin (c220g2, SSD /dev/sdc), the client and the computes in Utah
# (APT r320, no SSD: computes on a 12 GB tmpfs). Within a zone services use the 10 GbE LAN; across zones the public
# addresses (the two LANs do not route to each other; round trip ~39 ms).

name = "cloudlab_two_zone"
state_dir = "/mydata/jiyu/bench-two-zone"   # on the coordinator: env files, seed.json, binaries staged for rsync

[ssh]
