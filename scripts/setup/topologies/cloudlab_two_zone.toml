storcon = "a0"                           # + its Postgres, the broker's neighbour, the compute-hook stub
broker = "a0"
seed_compute = "a4"                      # loads the dataset over the Wisconsin LAN
pageservers = ["a2", "a5"]               # node ids 1, 2; a5 joins with scheduling Pause (shard-split uses it)
safekeepers = ["a0", "a1", "a3"]
compute_agents = ["b1", "b2", "b3", "b4", "b5", "b6", "b7"]   # round-robin; cold start uses the first

[doltgres]
version = "1.4.0"
server = "a4"                            # experiments 1/2: server and client on one node, one socket each
client = "a4"

