# Experiment 13 (pgcopy): 16 xl170 nodes at CloudLab Utah on one LAN (10.10.1.0/24, 25 GbE), re-instantiated 5 Nov 2026
# (.agent/cloudlab.md; n0-n15 = CloudLab node0-node15, .agent/network-probe-2026-11-05-xl170/nodes.txt).
# n0 holds the seed instance and every run root; n1-n15 host the branch instances, each with its own benchmark
# client (co-located). The coordinator (pc20.cloudlab.umass.edu, 51 ms away) is not a node: it reaches the nodes by
# ssh on their public names only. zone = "utah", not the default z0: the coordinator is a z0 node in the setup
# scripts, so it must see the nodes' public addresses. Data on the CloudLab blockstore /mydata (LVM on sda4).
name = "cloudlab_pgcopy"
state_dir = "/mydata/bench-pgcopy"

[ssh]
user = "JiyuHu23"
key = "~/.ssh/dassl_rsa"

[workload]
max_procs = 20

[pgcopy]
seed = "n0"
hosts = ["n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12", "n13", "n14", "n15"]
client = "n1"
pg_version = 17

[pgcopy.workload]
shared_buffers = "40MB"          # per instance: ~ Neon's 36 MB LFC + its shared_buffers at W = 3
seed_shared_buffers = "1GB"      # the seed instance while it is loaded (it stays up for the whole experiment)

[nodes.n0]
host = "hp024.utah.cloudlab.us"
lan = "10.10.1.1"
public = "128.110.218.63"
zone = "utah"
data_root = "/mydata"
disk_dev = "sda4"

