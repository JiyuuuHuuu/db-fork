[neon]
build_dir = "/mnt/ssd/neon-src"          # fork local-uds 4187e2da7 + exp 11 patches
transport = "tcp"
client = "b0"
storcon = "a0"
broker = "a0"
seed_compute = "a0"
pageservers = ["a4", "a5"]
safekeepers = ["a0"]
compute_agents = ["b1"]

[workload]
max_procs = 20                           # b0 has 20 hardware threads
W = 1                                    # the mini tenant is seeded with --scale 1
prewarm_heap_blocks = 850
